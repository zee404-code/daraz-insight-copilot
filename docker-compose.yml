version: '3.8'

networks:
  monitoring-net:
    driver: bridge

services:
  # FastAPI Application
  app:
    build: .
    container_name: daraz-app
    ports:
      - "8000:8000"
    user: "root"
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./faiss_index:/app/faiss_index
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_HOME=./models/hf_cache
      - EMBED_MODEL_PATH=sentence-transformers/all-MiniLM-L6-v2
      - HF_HUB_OFFLINE=0
      - TRANSFORMERS_OFFLINE=0
    networks:
      - monitoring-net

    # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: daraz-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./src/app/frontend.py:/app/frontend.py
    environment:
      - FASTAPI_URL=http://app:8000  # This is important for your frontend to call FastAPI
    networks:
      - monitoring-net

  # Prometheus Service (REQUIRED CONFIG)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # You still need this file!
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring-net

  # Grafana Service (MANUAL CONFIG)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    # I removed the 'volumes' block here.
    # Now it starts fresh, and you set it up in the browser.
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    user: "root"
    networks:
      - monitoring-net
